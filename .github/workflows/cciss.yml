name: Refresh public CCISS feed
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
concurrency:
  group: cciss-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate official public RSS
        shell: python
        run: |
          import urllib.request, xml.etree.ElementTree as ET, pathlib, json, datetime
          request = urllib.request.Request('https://www.cciss.it/rss', headers={'User-Agent':'Traffic RSS collector/1.0'})
          with urllib.request.urlopen(request, timeout=45) as response:
              content = response.read(2_000_001)
          assert len(content) <= 2_000_000, 'Feed too large'
          document = ET.fromstring(content)
          assert document.tag == 'rss' and document.findall('./channel/item'), 'Invalid or empty RSS'
          destination = pathlib.Path('feed')
          destination.mkdir(exist_ok=True)
          (destination/'cciss.xml').write_bytes(content)
          (destination/'status.json').write_text(json.dumps({'source':'https://www.cciss.it/rss','fetchedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'items':len(document.findall('./channel/item'))}))
      - name: Save updated public feed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add feed/cciss.xml feed/status.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh CCISS public traffic feed"
            git push
          fi
